# RAAHAT backend on one host: database, API, background worker.
#
#   ./scripts/dev-up.sh       start (builds, migrates, waits for health)
#   ./scripts/dev-down.sh     stop (data is kept in the raahat_pgdata volume)
#
# Network exposure:
#   - PostgreSQL has no published port. Only the api and worker containers reach it.
#   - The API is published on 127.0.0.1 only. The public HTTPS tunnel
#     (Tailscale Funnel, see NETWORK_CONNECTIVITY.md) connects to it locally.
#
# Memory limits are sized for an 8 GB laptop that is also used for other work;
# see RESOURCE_BUDGET.md for measurements.
name: raahat

x-app: &app
  build: .
  image: raahat-backend:local
  env_file: ${RAAHAT_ENV_FILE:-.env}
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-raahat}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-raahat}
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp:size=64m"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raahat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-raahat}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_compression=on
      - -c
      - checkpoint_timeout=10min
      - -c
      - log_min_duration_statement=500
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128m
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  api:
    <<: *app
    command: ["api"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - audio:/data/audio
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - audio:/data/audio
    mem_limit: 384m

volumes:
  pgdata:
    name: raahat_pgdata
  audio:
    name: raahat_audio
