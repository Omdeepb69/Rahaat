[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "raahat"
version = "0.3.0"
description = "RAAHAT: emergency intake, incident intelligence and rescue-resource coordination"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0.30,<2.2",
    "geoalchemy2>=0.15,<0.22",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1",
    "pyjwt>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
]
evaluation = [
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-p no:launch_testing -p no:cacheprovider --timeout=120"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
